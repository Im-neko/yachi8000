# yachi8000 の静的設定（F-60）。
#
# ここに書くのは「ユーザー体験の定義」だけ。接続先・認証情報は環境変数側にある。
# このファイルは利用者ごとの内容なのでコミットしない。SETTINGS_PATH の指す場所へ
# 複製して使う。設定 UI（フェーズ 6）も同じファイルを書き換える。
#
# 会話を通じて変化した人格は**このファイルには入らない**。別の実体（ランタイム
# 状態）に積まれる。混ぜると、一方の書き手が他方を消す。
#
# 設定 UI（F-61）が書き換えるのは、名前・人格・待機時の表情・カメラ・声・
# 通知の扱い・挙動だけ（→ D-44）。**ファイルのパス（vrmPath / gestures）と
# チャンネル ID は画面からは変わらない** ので、ここを手で書く。UI からの保存で
# このコメントが消えることはない（決まった場所だけを差し替えている）。

identity:
  # アシスタントの名前。
  name: やち
  #
  # 利用者の呼び方はここに無い。複数人が話しかけてくる前提なので、呼び名は
  # 相手ごとにランタイム状態へ持つ（→ F-05）。初対面の表示名を自動で覚え、
  # 「〇〇って呼んで」と頼まれたらその場で変わる。

persona:
  firstPerson: わたし
  personality: |
    おだやかで落ち着いている。頼まれたことは最後までやり切る。
    分からないことは分からないと言う。
  speechStyle: |
    ですます調。語尾を伸ばさない。絵文字は使わない。
    長い前置きを置かず、結論から書く。

# アバターの表示（F-20, F-62）。**この節ごと省ける** —— 書かなければアバターの
# ページが「設定されていません」と言うだけで、会話は普通に動く。
avatar:
  # VRM ファイルのパス。**この設定ファイルと同じ場所に置く**（→ D-36 の 2）。
  # リポジトリにはコミットしない。入手手順は docs/setup/avatar.md。
  vrmPath: ./data/avatar.vrm
  # 待機時の表情。**VRM 1.0 のプリセット名しか使えない**（→ D-36 の 1）。
  # neutral / happy / angry / sad / relaxed / surprised のいずれか。
  idleExpression: neutral
  camera:
    # 注視点の高さ（m）。モデルの身長に合わせる。顔を見たいなら目の高さ。
    targetHeight: 1.3
    # 注視点からの距離（m）。小さくすると寄る。
    distance: 1.5
  # 発話に合わせた身振り（F-25, → D-42）。**任意。書いた種類だけが出る。**
  # 実体は VRMA ファイルで、VRM と同じ場所に手で置く（リポジトリに入れない）。
  # 種類は固定で、この 6 つ以外は設定の時点で弾かれる。
  # gestures:
  #   nod: ./data/motions/nod.vrma          # 頷く（同意・了解・相槌）
  #   tilt: ./data/motions/tilt.vrma        # 首をかしげる（疑問・迷い）
  #   wave: ./data/motions/wave.vrma        # 手を振る（挨拶・呼びかけ）
  #   bow: ./data/motions/bow.vrma          # お辞儀（謝る・礼を言う）
  #   shrug: ./data/motions/shrug.vrma      # 肩をすくめる（分からない）
  #   present: ./data/motions/present.vrma  # 示す（説明・提示）
  # 素材の出どころ表記。**クレジット表記を条件にするライセンスがある**ので、
  # そういう素材を使うなら必ず書く（書けば画面の左上に出る → D-42 の 2）。
  # attribution: "キャラクターアニメーション: ピクシブ株式会社 VRoidプロジェクト"

voice:
  # 音声合成エンジンの話者 ID。エンジンによって中身が違うので、
  # 起動時に実在を検証して落とす（存在しない ID のまま無音になるのを防ぐ）。
  speakerId: 3
  # 話速（0.5〜2.0）と音高（-0.15〜0.15）。VOICEVOX の audio_query と同じ意味。
  speedScale: 1.0
  pitchScale: 0.0

notification:
  # 読み上げる出口がひとつも無いときの扱い。text ならテキストチャンネルへ回す、
  # drop なら捨てる。どちらでも「配信できなかった」ことはログに残る。
  #
  # 「出口」は VC の接続と、音を鳴らせるブラウザ（アバターのページで
  # 「音を出す」を押したタブ）の両方を指す。どちらかが聞いていれば読み上げる。
  whenNoOutput: drop
  # whenNoOutput: text のときの配信先。未設定なら drop と同じ扱いになる。
  # fallbackChannelId: "000000000000000000"
  # 通知が名前で選べる配信先。POST /api/v1/notify の channel に名前を書くと、
  # VC の接続状況に関わらずここのチャンネルへ必ず残る（読み上げは同じサーバに
  # いるときだけ）。ここに無い名前の通知は 400 で弾かれる。
  # チャンネル ID をリクエストで受けないのは、読み上げのために配ったトークンが
  # 「どこへでも書ける」権限に化けるのを避けるため。
  # channels:
  #   money:
  #     guildId: "000000000000000000"
  #     channelId: "000000000000000000"

# スレッドの元投稿を Issue にする先（F-37）。**チャンネル ID → owner/name。**
# ここに無いチャンネルでは起票しない（設定を書いた人だけが行き先を決める）。
# 起票には GITHUB_TOKEN（fine-grained PAT、対象リポジトリの issues: write）が要る。
# issueTracker:
#   repositories:
#     "000000000000000000": owner/repository

behavior:
  # 人格・口調固定モード（F-34）。true にすると、会話を通じて積み上がった
  # 人格の差分を応答に使わなくなる（記録自体は止めない。false に戻せば元の続きから効く）。
  # 人格に関わるスキル（kind: persona）も同じ理由でマウントされなくなる。
  personaLock: false
  # リマインダーの期限を確認する間隔（秒、5〜3600）。発火の粒度がそのままこの値になる。
  # 書き換えると次の確認から効く（再起動は要らない）。
  reminderPollIntervalSeconds: 30
